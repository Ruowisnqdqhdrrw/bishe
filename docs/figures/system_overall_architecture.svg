  <path d="M248 605 C294 605, 314 575, 364 575" class="arrow"/>
  <path d="M556 275 C610 275, 620 275, 678 275" class="arrow"/>
  <path d="M556 425 C610 425, 620 430, 678 430" class="arrow"/>
  <path d="M556 745 C610 745, 620 745, 678 745" class="arrow"/>
  <path d="M922 275 C974 275, 990 275, 1046 275" class="arrow"/>
  <path d="M922 430 C972 430, 992 430, 1046 430" class="arrow"/>
  <path d="M922 590 C972 590, 992 590, 1046 590" class="arrow"/>
  <path d="M922 755 C972 755, 992 755, 1046 755" class="arrow"/>
  <path d="M1264 275 C1316 275, 1328 286, 1380 286" class="arrow"/>
  <path d="M1264 430 C1310 430, 1330 465, 1380 465" class="arrow"/>
