<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f2eb"/>
      <stop offset="100%" stop-color="#edf3f8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#355166"/>
    </marker>
    <style>
      .title { font: 700 34px "Times New Roman", "Microsoft YaHei", serif; fill: #213340; }
      .subtitle { font: 500 17px "Times New Roman", "Microsoft YaHei", serif; fill: #5a7180; }
      .lane { stroke: #97aebf; stroke-width: 2; stroke-dasharray: 8 8; }
      .head { fill: #ffffff; stroke: #cad7df; stroke-width: 1.2; rx: 14; ry: 14; }
      .label { font: 600 18px "Microsoft YaHei", sans-serif; fill: #243744; }
      .small { font: 500 14px "Microsoft YaHei", sans-serif; fill: #5f7280; }
      .msg { stroke: #355166; stroke-width: 2.8; fill: none; marker-end: url(#arrow); }
      .ret { stroke: #8f6537; stroke-width: 2.4; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .note { font: 600 15px "Microsoft YaHei", sans-serif; fill: #83552e; }
    </style>
  </defs>
  <rect width="1600" height="960" fill="url(#bg)"/>
  <text x="800" y="56" text-anchor="middle" class="title">前后端交互时序图</text>
  <text x="800" y="86" text-anchor="middle" class="subtitle">Frontend-Backend Sequence Diagram for Upload and Online Sketch Recognition</text>
  <rect x="100" y="120" width="180" height="62" class="head"/>
  <text x="190" y="158" text-anchor="middle" class="label">用户浏览器</text>
  <rect x="420" y="120" width="180" height="62" class="head"/>
  <text x="510" y="158" text-anchor="middle" class="label">前端页面</text>
  <rect x="740" y="120" width="180" height="62" class="head"/>
  <text x="830" y="158" text-anchor="middle" class="label">Flask 后端</text>
  <rect x="1060" y="120" width="180" height="62" class="head"/>
  <text x="1150" y="158" text-anchor="middle" class="label">识别服务</text>
  <rect x="1340" y="120" width="180" height="62" class="head"/>
  <text x="1430" y="158" text-anchor="middle" class="label">数据存储</text>
  <line x1="190" y1="182" x2="190" y2="880" class="lane"/>
  <line x1="510" y1="182" x2="510" y2="880" class="lane"/>
  <line x1="830" y1="182" x2="830" y2="880" class="lane"/>
  <line x1="1150" y1="182" x2="1150" y2="880" class="lane"/>
  <line x1="1430" y1="182" x2="1430" y2="880" class="lane"/>
  <text x="120" y="230" class="note">上传识别主流程</text>
  <path d="M190 260 L510 260" class="msg"/>
  <text x="350" y="248" text-anchor="middle" class="small">选择图片 / 拖拽上传</text>
  <path d="M510 320 L830 320" class="msg"/>
  <text x="670" y="308" text-anchor="middle" class="small">POST /upload</text>
  <path d="M830 380 L1150 380" class="msg"/>
  <text x="990" y="368" text-anchor="middle" class="small">图像预处理 + 模型识别</text>
  <path d="M1150 440 L1430 440" class="msg"/>
  <text x="1290" y="428" text-anchor="middle" class="small">写入历史记录</text>
  <path d="M1430 500 L830 500" class="ret"/>
  <text x="1130" y="488" text-anchor="middle" class="small">history_id / 原图路径 / 结果文本</text>
  <path d="M830 560 L510 560" class="ret"/>
  <text x="670" y="548" text-anchor="middle" class="small">JSON: latex, word_linear, formula_png_url</text>
  <path d="M510 620 L190 620" class="ret"/>
  <text x="350" y="608" text-anchor="middle" class="small">渲染结果与复制入口</text>
  <text x="120" y="710" class="note">在线手写流程</text>
  <path d="M190 740 L510 740" class="msg"/>
  <text x="350" y="728" text-anchor="middle" class="small">Canvas 手写与提交</text>
  <path d="M510 790 L830 790" class="msg"/>
  <text x="670" y="778" text-anchor="middle" class="small">POST /recognize_sketch (base64)</text>
  <path d="M830 840 L1150 840" class="msg"/>
  <text x="990" y="828" text-anchor="middle" class="small">解码图像 -> 识别 -> 结果返回</text>
  <path d="M1150 870 L510 870" class="ret"/>
  <text x="830" y="858" text-anchor="middle" class="small">返回 LaTeX / MathML / PNG / 历史提示</text>
</svg>
