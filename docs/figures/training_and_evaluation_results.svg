<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f2eb"/>
      <stop offset="100%" stop-color="#edf4f8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px "Times New Roman", "Microsoft YaHei", serif; fill: #233340; }
      .subtitle { font: 500 17px "Times New Roman", "Microsoft YaHei", serif; fill: #5c7280; }
      .panel { fill: #ffffff; stroke: #d7dfe6; stroke-width: 1.4; rx: 22; ry: 22; filter: url(#shadow); }
      .axis { stroke: #536978; stroke-width: 2.2; }
      .grid { stroke: #d9e2ea; stroke-width: 1; }
      .bar1 { fill: #9fc5e8; }
      .bar2 { fill: #7fd8be; }
      .bar3 { fill: #f5af92; }
      .label { font: 600 18px "Microsoft YaHei", sans-serif; fill: #243744; }
      .small { font: 500 14px "Microsoft YaHei", sans-serif; fill: #60717f; }
      .value { font: 700 16px "Times New Roman", "Microsoft YaHei", serif; fill: #233744; }
      .note { font: 600 16px "Microsoft YaHei", sans-serif; fill: #875931; }
    </style>
  </defs>
  <rect width="1500" height="980" fill="url(#bg)"/>
  <text x="750" y="58" text-anchor="middle" class="title">训练与评估结果分析图</text>
  <text x="750" y="88" text-anchor="middle" class="subtitle">Training and Evaluation Comparison between Baseline V2 and Improved V3</text>
  <rect x="70" y="150" width="640" height="740" class="panel"/>
  <text x="390" y="190" text-anchor="middle" class="label">模型性能对比柱状图</text>
  <line x1="150" y1="760" x2="620" y2="760" class="axis"/>
  <line x1="150" y1="270" x2="150" y2="760" class="axis"/>
  <line x1="150" y1="660" x2="620" y2="660" class="grid"/>
  <line x1="150" y1="560" x2="620" y2="560" class="grid"/>
  <line x1="150" y1="460" x2="620" y2="460" class="grid"/>
  <line x1="150" y1="360" x2="620" y2="360" class="grid"/>
  <text x="120" y="764" class="small">0</text>
  <text x="110" y="664" class="small">20</text>
  <text x="110" y="564" class="small">40</text>
  <text x="110" y="464" class="small">60</text>
  <text x="110" y="364" class="small">80</text>
  <text x="110" y="274" class="small">100</text>
  <rect x="220" y="415" width="90" height="345" class="bar1"/>
  <rect x="340" y="352" width="90" height="408" class="bar2"/>
  <text x="265" y="402" text-anchor="middle" class="value">70.56%</text>
  <text x="385" y="339" text-anchor="middle" class="value">83.24%</text>
  <text x="325" y="800" text-anchor="middle" class="label">序列准确率</text>
  <rect x="460" y="336" width="90" height="424" class="bar1"/>
  <rect x="580" y="306" width="90" height="454" class="bar2"/>
  <text x="505" y="323" text-anchor="middle" class="value">86.58%</text>
  <text x="625" y="293" text-anchor="middle" class="value">92.69%</text>
  <text x="565" y="800" text-anchor="middle" class="label">Token 准确率</text>
  <rect x="210" y="850" width="18" height="18" class="bar1"/>
  <text x="238" y="864" class="small">原始 V2 模型</text>
  <rect x="370" y="850" width="18" height="18" class="bar2"/>
  <text x="398" y="864" class="small">改进 V3 模型</text>
  <rect x="790" y="150" width="640" height="740" class="panel"/>
  <text x="1110" y="190" text-anchor="middle" class="label">结果分析要点</text>
  <rect x="840" y="240" width="540" height="110" class="bar3" rx="18" ry="18"/>
  <text x="1110" y="286" text-anchor="middle" class="label">V3 序列准确率提升更明显</text>
  <text x="1110" y="312" text-anchor="middle" class="small">说明改进模型对整体公式结构建模能力更强</text>
  <rect x="840" y="390" width="540" height="110" class="bar3" rx="18" ry="18"/>
  <text x="1110" y="436" text-anchor="middle" class="label">SE + Coverage Attention 起到关键作用</text>
  <text x="1110" y="462" text-anchor="middle" class="small">增强特征表达并减轻重复关注与漏读问题</text>
  <rect x="840" y="540" width="540" height="110" class="bar3" rx="18" ry="18"/>
  <text x="1110" y="586" text-anchor="middle" class="label">数据增强与训练策略提升鲁棒性</text>
  <text x="1110" y="612" text-anchor="middle" class="small">对复杂书写风格和长公式具有更好适应性</text>
  <rect x="840" y="690" width="540" height="110" class="bar3" rx="18" ry="18"/>
  <text x="1110" y="736" text-anchor="middle" class="label">适合作为论文实验章节核心图</text>
  <text x="1110" y="762" text-anchor="middle" class="small">可与训练曲线、可视化样例联合使用</text>
  <text x="1110" y="850" text-anchor="middle" class="note">数据依据：logs/train_e2e_log.csv 与 logs/train_e2e_v3_log.csv 的最优结果</text>
</svg>
