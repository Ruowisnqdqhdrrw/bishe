{% extends "base.html" %}

{% block title %}修改密码 - 手写数学公式识别系统{% endblock %}

{% block head %}
<style>
    .password-shell {
        max-width: 560px;
        margin: 0 auto;
    }

    .password-card {
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 28px;
        padding: 28px;
        box-shadow: 0 20px 60px rgba(33, 64, 102, 0.08);
    }

    .password-card h1 {
        margin: 0 0 10px;
    }

    .password-card p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.7;
    }

    .password-form {
        display: grid;
        gap: 14px;
    }

    .password-form input {
        width: 100%;
        height: 48px;
        border-radius: 14px;
        border: 1px solid var(--line);
        padding: 0 14px;
        font-size: 16px;
        background: #fbfdff;
    }
    
    .password-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
    }
</style>
{% endblock %}

{% block body %}
<div class="password-shell">
    <section class="password-card">
        <h1>修改密码</h1>
        <p>管理员、老师和学生都可以在这里修改自己的登录密码。修改后立即生效。</p>
        <form class="password-form" method="POST">
            <input name="current_password" type="password" placeholder="当前密码" required>
            <input name="new_password" type="password" placeholder="新密码（至少 6 位）" required>
            <input name="confirm_password" type="password" placeholder="确认新密码" required>
            <div class="password-actions">
                <button class="button primary" type="submit">保存新密码</button>
                <a class="button ghost" href="{{ url_for('index') }}">返回首页</a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
